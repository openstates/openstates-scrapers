name: Build and push Docker image
on:
  push:
    branches:
      - main
    tags:
      - '*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: civic-eagle-enview-prod
          credentials_json: "${{ secrets.PLURAL_OPEN_REPO_PUSHER_KEY }}"
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Build and Push docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          tags: "openstates/scrapers:latest,openstates/scrapers:${{ github.sha }},us-central1-docker.pkg.dev/civic-eagle-enview-prod/open-containers/scrapers:latest,us-central1-docker.pkg.dev/civic-eagle-enview-prod/open-containers/scrapers:${{ github.sha }}"
          push: true
          cache-from: type=gha,scope=scrapers
          cache-to: type=gha,scope=scrapers,mode=max
