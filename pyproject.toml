[project]
name = "openstates-scrapers"
version = "2022.7"
description = ""
authors = [{ name = "James Turk", email = "dev@jamesturk.net" }]
requires-python = ">=3.13,<4"
dependencies = [
    "xlrd<2",
    "lxml>=5.3.1,<6",
    "pytz>=2024.1,<2025",
    "feedparser>=6.0,<7",
    "python-dateutil>=2.8,<3",
    "spatula>=0.9,<0.10",
    "chardet>=7.4,<8",
    "suds-py3>=1.3,<2",
    "requests>=2.34,<3",
    "cloudscraper>=1.2.58,<2",
    "ics>=0.7.2,<0.8",
    "pymupdf>=1.23.8,<2",
    "pandas>=2.1.4,<3",
    "openstates>=6.26.4,<7",
]

[project.optional-dependencies]
california = [
    "mysqlclient>=1.4.6,<2",
    "SQLAlchemy>=1.3,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3,<0.18",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["scrapers/il/tests"]

[tool.ruff.lint]
# flake8's default checks, minus the codes setup.cfg used to ignore
select = ["E", "W", "F"]
ignore = ["E501"]
