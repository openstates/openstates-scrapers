name: Scout Scrape

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
    # checkouts
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
    - name: checkout results repo
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        repository: openstates/scraper-artifacts
        path: artifacts
        token: ${{ secrets.GH_ACCESS_TOKEN }}

    # install python environment
    - name: install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      with:
        enable-cache: true
    - name: install python dependencies
      run: uv sync --frozen --no-dev

    # scout runs
    - name: run instrumented scout for people
      run: uv run --frozen scripts/instrumented_scout.py

    - name: update remote git repo if necessary
      run: |-
        cd artifacts
        git diff
        git config --global user.email "actions@users.noreply.github.com"
        git config --global user.name "openstates-bot"
        git add -A
        git commit -m "scout run" || exit 0
        git push
